name: Release IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'IPA version (vMAJOR.MINOR.PATCH). Manual builds are saved as artifacts.'
        required: true
        default: 'v0.6.1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ios-ci.yml
  release:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Generate project
        run: bash scripts/prepare-macos.sh
      - name: Build device app and package unsigned IPA
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: bash scripts/package-ipa.sh "$RELEASE_TAG"
      - name: Save IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Dispatch-IPA-${{ github.run_id }}
          path: |
            build/Dispatch-*.ipa
            build/Dispatch-*.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "build/Dispatch-${RELEASE_TAG}.ipa" "build/Dispatch-${RELEASE_TAG}.ipa.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "build/Dispatch-${RELEASE_TAG}.ipa" "build/Dispatch-${RELEASE_TAG}.ipa.sha256" \
              --verify-tag --title "Dispatch ${RELEASE_TAG}" --notes-file docs/release-notes.md
          fi
      - name: Preserve release build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.run_id }}
          path: build/release-build.log
          if-no-files-found: warn
