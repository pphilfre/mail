name: Release IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: IPA version (vMAJOR.MINOR.PATCH)
        required: true
        default: v0.9.0
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ios-ci.yml
    with:
      test_scope: full
  package:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/xcode-setup
        with:
          variant: device
      - name: Build device app and package unsigned IPA
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          bash scripts/package-ipa.sh "$RELEASE_TAG"
          python3 scripts/cache-inputs.py save build/input-times.json
      - name: Save IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Dispatch-IPA-${{ github.run_id }}
          path: |
            build/Dispatch-*.ipa
            build/Dispatch-*.ipa.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Preserve release build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.run_id }}
          path: build/release-build.log
          if-no-files-found: warn
  publish:
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Dispatch-IPA-${{ github.run_id }}
          path: build
      - name: Verify checksum and publish validated IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha256sum --check "build/Dispatch-${RELEASE_TAG}.ipa.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite its assets' >&2
            exit 1
          fi
          # A manual run must never attach a new IPA to a tag for a different commit.
          tag_ref="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$tag_ref" ]]; then
            git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" "build/Dispatch-${RELEASE_TAG}.ipa" "build/Dispatch-${RELEASE_TAG}.ipa.sha256" \
            --target "$GITHUB_SHA" --title "Dispatch ${RELEASE_TAG}" --notes-file docs/release-notes.md
          echo "[Download Dispatch ${RELEASE_TAG} from Releases](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})" >> "$GITHUB_STEP_SUMMARY"
