name: Release IPA

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require passing iOS CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit_sha="$(git rev-parse HEAD)"
          passed_runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ios-ci.yml/runs" \
            -f head_sha="$commit_sha" -f status=completed -f event=push \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$passed_runs" -eq 0 ]]; then
            echo "This commit has no passing iOS CI run. Wait for CI, then rerun this release workflow." >&2
            exit 1
          fi
  release:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Generate project
        run: bash scripts/prepare-macos.sh
      - name: Build device app and package unsigned IPA
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package-ipa.sh "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "build/Dispatch-${RELEASE_TAG}.ipa" "build/Dispatch-${RELEASE_TAG}.ipa.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "build/Dispatch-${RELEASE_TAG}.ipa" "build/Dispatch-${RELEASE_TAG}.ipa.sha256" \
              --verify-tag --title "Dispatch ${RELEASE_TAG}" --notes-file docs/release-notes.md
          fi
      - name: Preserve release build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.run_id }}
          path: build/release-build.log
          if-no-files-found: warn
