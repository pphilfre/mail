name: iOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Optional XCTest selector, such as DispatchUITests/DispatchUITests/testSampleMessageOpens'
        required: false
        default: ''
        type: string
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Generate project with XcodeGen
        run: bash scripts/prepare-macos.sh
      - name: Build once and run unit and UI tests
        env:
          DISPATCH_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_filter || '' }}
        run: bash scripts/test-ios.sh
      - name: Export simulator screenshots
        if: always()
        continue-on-error: true
        run: |
          if [[ -d build/Tests.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          fi
      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ github.run_id }}
          path: |
            build/*.log
            build/Tests.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: warn
