name: iOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Generate project with XcodeGen
        run: bash scripts/prepare-macos.sh
      - name: Build and test on an iOS simulator
        run: bash scripts/test-ios.sh
      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ github.run_id }}
          path: |
            build/*.log
            build/Tests.xcresult
          retention-days: 14
          if-no-files-found: warn
