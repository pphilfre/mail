name: iOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Optional XCTest selector, such as DispatchUITests/DispatchUITests/testSampleMessageOpens'
        required: false
        default: ''
        type: string
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Generate project with XcodeGen
        run: bash scripts/prepare-macos.sh
      - name: Build once and run unit and UI tests
        env:
          DISPATCH_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_filter || '' }}
        run: bash scripts/test-ios.sh
      - name: Export simulator screenshots
        if: always()
        continue-on-error: true
        run: |
          if [[ -d build/Tests.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          fi
      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ github.run_id }}
          path: |
            build/*.log
            build/Tests.xcresult
            build/screenshots/
          retention-days: 14
          if-no-files-found: warn

  device-ipa:
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref_type != 'tag' && github.workflow != 'Release IPA'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Generate device project
        run: bash scripts/prepare-macos.sh
      - name: Build and package unsigned device IPA
        run: |
          version="$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)"/\1/p' project.yml | head -n 1)"
          bash scripts/package-ipa.sh "v${version}"
      - name: Save IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Dispatch-device-IPA-${{ github.run_id }}
          path: |
            build/Dispatch-*.ipa
            build/Dispatch-*.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Save device build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-${{ github.run_id }}
          path: build/release-build.log
          if-no-files-found: warn
