name: iOS CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional comma-separated XCTest selectors for diagnosis (never used by releases)
        default: ''
        type: string
      test_scope:
        description: UI suite scope; all unit tests always run unless test_filter is set
        default: smoke
        type: choice
        options: [full, smoke]
  workflow_call:
    inputs:
      test_scope:
        default: full
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Release IPA' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check CI partitioning and cache invalidation
        run: python3 scripts/check-ci.py
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REQUESTED_SCOPE: ${{ inputs.test_scope || 'full' }}
          TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.test_filter || '' }}
        run: |
          scope="$REQUESTED_SCOPE"
          # Main IPA builds use all unit tests and critical UI checks. Full UI coverage
          # stays on UI pull requests, weekly regression runs and the release gate.
          if [[ "$EVENT" == push && "${{ github.workflow }}" != 'Release IPA' ]]; then scope=smoke; fi
          if [[ "$EVENT" == pull_request ]]; then
            scope=smoke
            if git diff --name-only "$BASE...$HEAD" | grep -Eq '^(App/|Features/|DesignSystem/|Tests/UI/|Configuration/|project.yml|scripts/|\.github/)'; then scope=full; fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          if [[ "$scope" == full && -z "$TEST_FILTER" ]]; then
            echo 'shards=[0,1,2]' >> "$GITHUB_OUTPUT"
          else
            echo 'shards=[0]' >> "$GITHUB_OUTPUT"
          fi
  compile:
    needs: plan
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/xcode-setup
        with:
          variant: simulator
          coverage: ${{ github.event_name == 'schedule' && 'YES' || 'NO' }}
      - name: Compile app and test bundles once
        env:
          DISPATCH_COVERAGE: ${{ github.event_name == 'schedule' && 'YES' || 'NO' }}
        run: bash scripts/build-tests.sh
      - name: Share compiled tests
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-products
          path: build/test-products.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Preserve compilation logs and resolved dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build-${{ github.run_id }}
          path: |
            build/*.log
            Dispatch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 7
  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Boot simulator while compilation runs
        run: |
          mkdir -p build
          simulator_id="$(python3 scripts/select-simulator.py)"
          echo "DISPATCH_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          (
            xcrun simctl boot "$simulator_id" || xcrun simctl list devices booted | grep -F "$simulator_id"
            xcrun simctl bootstatus "$simulator_id" -b
          ) > build/simulator-boot.log 2>&1
      - name: Wait for this run's compiled tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait-test-products.py
      - uses: actions/download-artifact@v4
        with:
          name: simulator-test-products
          path: build
      - name: Run unit tests and assigned UI tests without rebuilding
        env:
          DISPATCH_TEST_SCOPE: ${{ needs.plan.outputs.scope }}
          DISPATCH_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_filter || '' }}
        run: bash scripts/run-test-shard.sh '${{ matrix.shard }}'
      - name: Export simulator screenshots
        if: always()
        continue-on-error: true
        run: |
          if [[ -d build/Tests.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            build/*.log
            build/test-selectors.txt
            build/Tests.xcresult
            build/screenshots/
          retention-days: 7
          if-no-files-found: warn
  build-and-test:
    if: always()
    needs: [plan, compile, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation stage
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success'

  device-ipa:
    needs: plan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag' && github.workflow == 'iOS CI' && inputs.test_filter == ''
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/xcode-setup
        with:
          variant: device
      - name: Build and package unsigned device IPA
        run: |
          version="$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)"/\1/p' project.yml | head -n 1)"
          bash scripts/package-ipa.sh "v${version}"
          python3 scripts/cache-inputs.py save build/input-times.json
      - name: Save IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Dispatch-device-IPA-${{ github.run_id }}
          compression-level: 0
          path: |
            build/Dispatch-*.ipa
            build/Dispatch-*.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Save device build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-${{ github.run_id }}
          path: build/release-build.log
          if-no-files-found: warn
