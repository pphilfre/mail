name: Dispatch
options:
  bundleIdPrefix: dev.freddiephilpot
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Dispatch:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Simulator.entitlements, GeneratedInfo.plist]
      - Core
      - path: Features
        excludes: ["**/*.md"]
      - DesignSystem
      - path: Providers
        excludes: ["**/*.md"]
      - path: Configuration
        buildPhase: resources
    info:
      path: App/GeneratedInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Google OAuth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.350736449780-jdq6jll8nm6kpiq267saoa0qt9dmnli1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.freddiephilpot.dispatch
        PRODUCT_MODULE_NAME: DispatchMail
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Simulator.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dispatch
        INFOPLIST_KEY_NSCameraUsageDescription: Scan documents to attach to your email.
        INFOPLIST_KEY_NSContactsUsageDescription: Save a sender to Contacts when you choose Add Contact.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
  DispatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/Unit
    dependencies:
      - target: Dispatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DispatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/UI
    dependencies:
      - target: Dispatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dispatch:
    build:
      targets:
        Dispatch: all
    test:
      debugEnabled: false
      targets:
        - DispatchTests
        - DispatchUITests
      gatherCoverageData: true
    archive:
      config: Release
